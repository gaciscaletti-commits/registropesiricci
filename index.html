<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Pesi Animali</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <button class="archive-button" id="archiveButton">📁 Archivio</button>
            <h1>Registro Pesi</h1>
        </header>
        
        <main class="cards-container" id="cardsContainer">
            <!-- Le card verranno aggiunte dinamicamente tramite JavaScript -->
        </main>
        
        <!-- Pulsante in basso -->
        <button class="add-button" id="addCardButton">+</button>
    </div>
    
    <!-- Modale per aggiungere nuova card -->
    <div class="modal" id="addCardModal">
        <div class="modal-content">
            <h2>Nuova Scheda</h2>
            <div class="form-group">
                <label for="cardNumber">Numero (4 cifre):</label>
                <input type="number" id="cardNumber" min="1000" max="9999" placeholder="Inserisci numero" required>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancelCardBtn">Annulla</button>
                <button class="btn-confirm" id="confirmCardBtn">Crea</button>
            </div>
        </div>
    </div>
    
    <!-- Modale per azione scheda (deceduto/liberato/spostato) -->
    <div class="modal" id="actionModal">
        <div class="modal-content">
            <h2 id="actionModalTitle">Azioni Scheda</h2>
            <div class="action-options" id="actionOptions">
                <button class="action-btn" id="deceasedBtn">Deceduto</button>
                <button class="action-btn" id="releasedBtn">Liberato</button>
                <button class="action-btn" id="movedBtn" style="display: none;">Spostato</button>
                <button class="action-btn" id="deleteBtn">Elimina</button>
            </div>
            <div class="move-selector" id="moveSelector" style="display: none; margin-top: 20px;">
                <p>Seleziona l'ID da spostare:</p>
                <div class="move-options" id="moveOptions"></div>
            </div>
            <div class="modal-buttons" style="margin-top: 20px;">
                <button class="btn-cancel" id="cancelActionBtn">Annulla</button>
                <button class="btn-confirm" id="confirmActionBtn">Conferma</button>
            </div>
        </div>
    </div>
    
    <!-- Modale archivio -->
    <div class="modal" id="archiveModal">
        <div class="modal-content archive-modal">
            <h2>Archivio Schede</h2>
            <div class="archive-filter" id="archiveFilter">
                <button class="filter-btn active" data-status="all">Tutte</button>
                <button class="filter-btn" data-status="deceased">Decedute</button>
                <button class="filter-btn" data-status="released">Liberate</button>
            </div>
            <div class="archive-list" id="archiveList">
                <!-- Le schede archiviate verranno aggiunte qui -->
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" id="closeArchiveBtn">Chiudi</button>
            </div>
        </div>
    </div>
    
    <!-- Modale per visualizzare/aggiungere pesi -->
    <div class="modal" id="weightModal">
        <div class="modal-content weight-modal">
            <div class="weight-modal-header">
                <h2 id="modalCardTitle">Scheda</h2>
                <button class="remove-button visible" id="removeCardButton">-</button>
            </div>
            
            <div class="weights-table-container">
                <div class="card-numbers-display" id="cardNumbersDisplay"></div>
                <table class="weights-table" id="weightsTable">
                    <thead id="weightsTableHead">
                    </thead>
                    <tbody id="weightsTableBody">
                    </tbody>
                </table>
                <p class="empty-weights" id="emptyWeightsMsg">Nessun peso registrato. Aggiungine uno!</p>
            </div>
            
            <div class="add-weight-form">
                <h3>Aggiungi Peso</h3>
                <div class="form-group">
                    <label for="weightDate">Data:</label>
                    <input type="text" id="weightDate" placeholder="GG/MM/AAAA" maxlength="10" required>
                </div>
                <div id="weightInputsContainer" class="weight-inputs-container">
                    <!-- Input per ogni ID verranno aggiunti qui -->
                </div>
                <div class="modal-buttons">
                    <button class="btn-cancel" id="cancelWeightBtn">Chiudi</button>
                    <button class="btn-confirm" id="addWeightBtn">Aggiungi Peso</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
